
{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EduManager 로그인</title>
    <link rel="stylesheet" href="{% static 'academy/styles.css' %}">
</head>
<body class="auth-body">
    <main class="auth-card">
        <div class="login-logo">
            <div class="login-mark">E</div>
            <h1>EduManager</h1>
        </div>

        {% if messages %}
        <div class="message-area auth-message">
            {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label>아이디</label>
                <input type="text" name="username" class="form-control" autofocus required>
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn primary big full" type="submit">로그인</button>
        </form>

        <div class="public-reserve-box">
            <p>학부모이신가요?</p>
            <a class="btn outline full" href="{% url 'public_apply' %}">방문상담 예약하기</a>
            <a class="btn outline full" href="{% url 'public_checkin' %}">학생 출석 체크하기</a>
        </div>

        <div class="test-account-box">
            <p>테스트 계정</p>
            <span>원장: owner / owner1234</span>
            <span>교사: teacher / teacher1234</span>
        </div>
    </main>
</body>
</html>
