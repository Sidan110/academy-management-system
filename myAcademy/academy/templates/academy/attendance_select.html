{% extends 'academy/base.html' %}

{% block title %}출석 체크{% endblock %}
{% block page_title %}출석 체크{% endblock %}
{% block page_description %}수업반과 날짜를 선택한 뒤 출석을 체크합니다.{% endblock %}

{% block content %}
<section class="card form-card narrow">
    <form method="post">
        {% csrf_token %}

        <div class="form-grid one">
            <div class="form-group">
                <label>수업반</label>
                <select name="classroom" class="form-control" required>
                    <option value="">수업반 선택</option>
                    {% for classroom in classrooms %}
                    <option value="{{ classroom.id }}">{{ classroom.name }} / {{ classroom.teacher }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>날짜</label>
                <input type="date" name="date" class="form-control" value="{{ today|date:'Y-m-d' }}" required>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn primary big" type="submit">출석 체크 시작</button>
        </div>
    </form>
</section>
{% endblock %}
